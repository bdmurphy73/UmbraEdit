name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + pyright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install UV and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install Dependencies
        # The lock file is the single source of truth for the versions of
        # ruff and pyright, so that this job and the Syntax workflow always
        # agree on the formatting and the type checking rules.
        run: |
          uv sync --no-dev --group lint --group test

      - name: Run ruff check
        run: uv run --no-sync ruff check .

      - name: Run ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Run pyright
        run: uv run --no-sync pyright

  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12", "3.13"]
        exclude:
          # macOS + 3.11 sometimes has PyQt6 issues on GH Actions
          - os: macos-latest
            python-version: "3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # The system PyQt6 package pulls in the Qt 6 runtime libraries
          # that the PyQt6 wheel needs, and the enchant library with a
          # couple of dictionaries is needed for the spell checker.
          sudo apt-get install -y \
            python3-pyqt6 \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            libenchant-2-dev \
            hunspell-en-us \
            hunspell-en-gb

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install enchant

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "pyqt6>=6.4,!=6.12.1" "pyenchant>=3.3.0" "jsonschema>=4.25.1" "python-docx>=1.1.0" "lxml>=5.0.0" "httpx>=0.28.0" "pillow>=11.3.0"
          pip install "fastapi>=0.115" "uvicorn>=0.34"
          pip install "pytest>=6.0.0" pytest-qt pytest-timeout coverage tzdata

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/ -vv --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            .pytest_cache/
            .coverage
          retention-days: 7

  test-coverage:
    name: Test with Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pyqt6 \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            libenchant-2-dev \
            hunspell-en-us \
            hunspell-en-gb

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "pyqt6>=6.4,!=6.12.1" "pyenchant>=3.3.0" "jsonschema>=4.25.1" "python-docx>=1.1.0" "lxml>=5.0.0" "httpx>=0.28.0" "pillow>=11.3.0"
          pip install "fastapi>=0.115" "uvicorn>=0.34"
          pip install "pytest>=6.0.0" pytest-qt pytest-timeout coverage tzdata

      - name: Run tests with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          coverage run -m pytest tests/ -vv --tb=short
          coverage xml
          coverage report --skip-covered --show-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: umbraedit-coverage
          fail_ci_if_error: false
