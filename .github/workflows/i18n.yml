name: i18n

on:
  pull_request:
    branches:
      - main
      - release
    paths:
      - i18n/*.ts

jobs:
  buildI18n:
    name: Build i18n
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Python Setup
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
          architecture: x64

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install System Packages
        run: |
          sudo apt update
          # The Qt 6 Linguist tools live in qt6-l10n-tools. The old
          # qttools6-dev-tools package is no longer available on the
          # current Ubuntu runner images.
          sudo apt install -y qt6-l10n-tools

      - name: Build Assets
        run: python pkgutils.py qtlrelease

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nw-i18n
          path: umbraedit/assets/i18n/*.qm
          if-no-files-found: error
          retention-days: 7
