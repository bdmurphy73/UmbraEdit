name: Part Assets

on:
  workflow_call:

jobs:
  buildAssets:
    name: Build Assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install System Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y qttools5-dev-tools latexmk texlive texlive-latex-extra

      - name: Install UV and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync --no-dev --group docs

      - name: Build Assets
        run: |
          uv run --no-sync pkgutils.py build-assets

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nw-assets
          path: |
            umbraedit/assets/manual*.pdf
            umbraedit/assets/sample.zip
            umbraedit/assets/i18n/*.qm
          if-no-files-found: error
          retention-days: 14
