name: Part MacOS M1

on:
  workflow_call:

jobs:
  buildMac-M1:
    name: Build on MacOS AARCH64
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      PYTHON_VERSION: "3.12"
      PACKAGE_ARCH: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nw-assets
          path: umbraedit/assets

      - name: Build App Bundle
        id: build
        run: |
          echo "BUILD_VERSION=$(python3 pkgutils.py version)" >> $GITHUB_OUTPUT
          echo "DMG_ARCH=$(uname -m)" >> $GITHUB_OUTPUT
          ./setup/macos/build.sh $PYTHON_VERSION $PACKAGE_ARCH

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: UmbraEdit-${{ steps.build.outputs.BUILD_VERSION }}-MacOS-${{ steps.build.outputs.DMG_ARCH }}-DMG
          path: dist_macos/umbraedit-*.dmg*
          if-no-files-found: error
          retention-days: 14
