name: UmbraEdit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/**]

jobs:
  brand:
    name: Brand Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The audit checks that no file in the tree carries the upstream product
      # name, and that no upstream brand graphic or binary has been copied
      # into the project.
      - name: Run brand audit
        run: python utils/umbra_brand_audit.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      # The lock file is the single source of truth for the version of ruff,
      # so that this job and the Syntax workflow always agree on the rules.
      - run: uv sync --no-dev --group lint --group test
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      # Pyright needs the runtime and test dependencies to be able to
      # resolve the imports of the code base.
      - run: uv sync --no-dev --group lint --group test
      - run: uv run --no-sync pyright umbraedit/ tests/

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt6 libenchant-2-dev hunspell-en-us hunspell-en-gb qt6-image-formats-plugins
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install enchant
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "pyqt6>=6.4,!=6.12.1" "pyenchant>=3.3.0" "jsonschema>=4.25.1" "python-docx>=1.1.0" "lxml>=5.0.0" "httpx>=0.28.0" "pillow>=11.3.0"
          pip install "fastapi>=0.115" "uvicorn>=0.34"
          pip install pytest pytest-qt pytest-timeout pyyaml
      - name: Run tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v --timeout=120
